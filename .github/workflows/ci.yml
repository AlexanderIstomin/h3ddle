name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install project generator and media tooling
        # ffmpeg is required for the engine to advertise video generation;
        # the handshake capability check fails without it.
        run: brew install xcodegen ffmpeg
      - name: Verify, test, and build
        run: Scripts/ci.sh

