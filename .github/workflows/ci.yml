name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify, test, and build
        run: Scripts/ci.sh

