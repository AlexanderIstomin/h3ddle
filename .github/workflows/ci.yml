name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      # macos-15 currently defaults to Xcode 16.4, whose SDK does not include
      # the VideoToolbox super-resolution APIs used by the app. Keep this
      # runner to exercise the macOS 15 deployment target, but build with the
      # Xcode 26 SDK required by the project.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Install project generator and media tooling
        # ffmpeg is required for the engine to advertise video generation;
        # the handshake capability check fails without it.
        run: brew install xcodegen ffmpeg
      - name: Verify, test, and build
        # The UI bundle is compiled by Scripts/ci.sh, while interaction tests
        # remain an explicit developer run. Hosted macOS runners can lose the
        # app process or accessibility tree despite a successful app launch.
        run: Scripts/ci.sh
