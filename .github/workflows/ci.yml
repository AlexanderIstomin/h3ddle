name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Install project generator and media tooling
        # ffmpeg is required for the engine to advertise video generation;
        # the handshake capability check fails without it.
        run: brew install xcodegen ffmpeg
      - name: Verify, test, and build
        # The UI tests launch a real window and steal keyboard focus, so
        # Scripts/ci.sh leaves them out unless asked. Nothing is competing for
        # the screen on a runner, which is where they belong.
        env:
          H3DDLE_UI_TESTS: "1"
        run: Scripts/ci.sh
