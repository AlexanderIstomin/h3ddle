name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: macos-15
    env:
      # Match CI and compile against the SDK that provides the VideoToolbox
      # super-resolution APIs while preserving macOS 15 as the deployment and
      # runner target.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install project generator and media tooling
        run: brew install xcodegen ffmpeg
      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml --project .
      - name: Archive the app
        # Ad-hoc signing keeps the build reproducible without secrets. It does
        # not establish a trusted developer identity, but it does produce a
        # structurally valid bundle instead of the malformed linker-only
        # signature Gatekeeper reports as a damaged app.
        run: |
          xcodebuild \
            -project H3ddle.xcodeproj \
            -scheme H3ddle \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/H3ddle.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -quiet \
            archive
      - name: Verify the archived bundle
        run: |
          APP="build/H3ddle.xcarchive/Products/Applications/H3ddle.app"
          test -d "$APP"
          test -x "$APP/Contents/Helpers/H3ddleEngineService"
          test -f "$APP/Contents/Resources/H3Engine/h3_shaders.metal"
          test -f "$APP/Contents/Resources/H3Engine/h3_sol_attention.metal"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package the app
        run: |
          APP="build/H3ddle.xcarchive/Products/Applications/H3ddle.app"
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(git rev-parse --short HEAD)"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/H3ddle-$VERSION.zip"
          # Record a bare filename so `shasum -c` works in the download folder.
          (cd dist && shasum -a 256 "H3ddle-$VERSION.zip" > "H3ddle-$VERSION.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: H3ddle-app
          path: dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Ad-hoc-signed development build for testing. This build has a valid
          bundle signature, but it is not yet Developer ID notarized.

          **First launch:** macOS may say the developer cannot be verified.
          Control-click H3ddle in Finder, choose Open, then confirm Open; or use
          System Settings > Privacy & Security > "Open Anyway". A "damaged" or
          "corrupted" warning is not expected—please report it instead of
          disabling Gatekeeper.

          This hotfix prevents an unavailable generation model from silently
          falling back to a three-second fake result. Generate is now disabled
          until an installed model is explicitly selected, and the shipped app
          fails closed if its production provider cannot be configured.

          Engine, queue, and project persistence paths now verify that a
          completed generation produced a real, non-empty output file. Missing
          output is reported as a failed job instead of creating a phantom
          `Media/*.mp4` project entry that AVFoundation cannot open.

          FastH3 VSA remains available as a managed H3 video model with the
          notification and VideoToolbox compatibility fixes from v0.7.9.

          **Requirements:** Apple silicon and macOS 15 or later. FFmpeg is an
          optional fallback for containers the system frameworks cannot read.
          Models are downloaded inside the app from Model Settings; ~32 GB of
          unified memory is recommended for local generation.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "H3ddle $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --prerelease
